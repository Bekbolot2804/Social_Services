{% extends 'base.html' %}

{% block title %}{{help.name}}{% endblock %}

{% block container %}
<div class = "aboutHead">
    <img src="{{help.img_url}}" alt = "helpLogo" class = "aboutHeadLogo">
    <div class = "aboutHeadContent">
        <h2 class = "oswaldH">{{help.name}}</h2>
        <p class = "georgiaP">{{help.|safe}}</p>
    </div>
</div>
<div class = "aboutContent">
    <p class = "georgiaP">{{help.description|safe}}</p>
</div>
{% endblock %}
